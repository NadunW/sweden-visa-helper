name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate HTML
        run: npm run lint
      - name: Run tests
        run: npm test

  version:
    # Every PR must carry a new X.Y.Z version that has not been released yet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bump
        run: |
          export BASE_VERSION=$(git show "origin/${{ github.base_ref }}:package.json" | jq -r .version)
          export EXISTING_TAGS="$(git tag -l 'v*' | tr '\n' ' ')"
          echo "Base version: $BASE_VERSION, PR version: $(jq -r .version package.json)"
          node scripts/check-version.js

  release:
    # On merge to main: tag vX.Y.Z and publish a GitHub release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::warning::Tag v$VERSION already exists; skipping release (deploy still runs)."
            exit 0
          fi
          (cd app && zip -qr "../sweden-visa-helper-v$VERSION.zip" . -x config.js)
          gh release create "v$VERSION" "sweden-visa-helper-v$VERSION.zip" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

  deploy:
    # Publish the released version to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write runtime config
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          jq -n --arg id "$GOOGLE_CLIENT_ID" --arg v "$VERSION" '{googleClientId:$id, version:$v}' \
            | sed '1s/^/window.APP_CONFIG = /; $s/$/;/' > app/config.js
          cat app/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
