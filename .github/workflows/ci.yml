name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate HTML
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Upload app as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweden-visa-helper
          path: app/
